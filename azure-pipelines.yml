resources:
- repo: self

stages:
- stage: Build
  displayName: Build and Push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
      persistCredentials: true
      clean: true

    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(Build.Repository.Name)
        dockerfile: $(Build.SourcesDirectory)
        containerRegistry: $(registry)
        tags: |
          $(Build.BuildId)
          latest

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Pipeline.Workspace)/s/manifests'
        artifact: 'manifests'
        publishLocation: 'pipeline'

- stage: Deploy
  displayName: Deploy stage
  dependsOn: Build
  jobs:
  - deployment: Deploy
    displayName: Deploy
    pool:
      vmImage: ubuntu-latest
    environment: 'tuberculosis-frontend'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: KubernetesManifest@0
            displayName: Create ImagePullSecret
            inputs:
              action: createSecret
              secretName: secret
              dockerRegistryEndpoint: $(registry)
              kubernetesServiceConnection: $(K8S)
              namespace: $(ns)

          - task: KubernetesManifest@0
            displayName: Deploy to Kubernetes cluster
            inputs:
              action: deploy
              kubernetesServiceConnection: $(K8S)
              namespace: $(ns)
              manifests: |
                $(Pipeline.Workspace)/manifests/secret.yml
                $(Pipeline.Workspace)/manifests/deploy.yml
              containers: |
                 acrpriori.azurecr.io/$(Build.Repository.Name):$(tag)
              imagePullSecrets: |
                secret
